name: build

on:
  push:
    branches: [main]
    # release tags as created by "git release": X.Y.Z
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to attach the jar to the release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit and integration tests; the integration tests download and start the Keycloak distribution.
      # A release tag sets the version of the jar.
      - name: Build and test
        run: mvn -B verify -Drevision=${{ github.ref_type == 'tag' && github.ref_name || 'dev-SNAPSHOT' }}

      - name: Attach jar to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # "git release" creates the release entry with the release notes right after pushing the tag.
          # If there is none (e.g. that step failed), create one without notes, so that the jar is not lost.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes ""
          fi
          gh release upload "$TAG" "target/keycloak-ldap-password-hash-$TAG.jar" --clobber
